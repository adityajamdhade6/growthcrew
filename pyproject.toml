[project]
name = "growthcrew"
version = "0.1.0"
description = "A multi-agent AI marketing team for small businesses, with a human approving every output."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlmodel",
    "httpx",
    "beautifulsoup4",
    "trafilatura",
    "python-dotenv",
    "tenacity",
    "jinja2",
    "fpdf2>=2.8.9",
    "markdown>=3.11",
    "streamlit>=1.65.0",
]

[project.scripts]
growthcrew = "growthcrew.cli:run"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/growthcrew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.report]
# Tests fail below this. The package sits near 95%.
fail_under = 85

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Fixture data reads better unwrapped.
"evals/golden/brands.py" = ["E501"]
"evals/demo_seed.py" = ["E501"]
# Report and template text reads better unwrapped.
"src/growthcrew/pilot.py" = ["E501"]
"tests/test_pilot.py" = ["E501"]
"tests/test_hardening.py" = ["E501"]
"streamlit_app.py" = ["E501"]
"tests/test_decision_rule.py" = ["E501"]
