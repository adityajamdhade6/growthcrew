name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: make lint
      - name: Chromium for the creative rendering tests
        run: uv run playwright install --with-deps chromium
      - name: Tests (fails below 85% coverage)
        env:
          # The rendering tests must run here, not be skipped.
          GROWTHCREW_REQUIRE_BROWSER: "1"
        run: uv run pytest -q --cov=growthcrew --cov-report=term
      - name: Offline evals
        run: make eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard
          path: evals/results/scorecard.*

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build (type-checks the app)
        run: npm run build
